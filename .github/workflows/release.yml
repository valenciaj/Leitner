name: Release

# Se lanza al subir una etiqueta como v1.0.0, o a mano desde la pestaña Actions.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LEITNER_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto LEITNER_KEYSTORE_BASE64 (ver README, sección Publicar)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leitner.jks"
          echo "LEITNER_KEYSTORE_FILE=$RUNNER_TEMP/leitner.jks" >> "$GITHUB_ENV"

      - name: Versión
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then NAME="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "LEITNER_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "LEITNER_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Compilar APK y AAB firmados
        env:
          LEITNER_KEYSTORE_PASSWORD: ${{ secrets.LEITNER_KEYSTORE_PASSWORD }}
          LEITNER_KEY_ALIAS: ${{ secrets.LEITNER_KEY_ALIAS }}
          LEITNER_KEY_PASSWORD: ${{ secrets.LEITNER_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test assembleRelease bundleRelease

      - name: Renombrar
        run: |
          mkdir out
          cp app/build/outputs/apk/release/app-release.apk "out/leitner-$LEITNER_VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/leitner-$LEITNER_VERSION_NAME.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: leitner-release
          path: out/

      - name: Publicar en GitHub Releases
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
